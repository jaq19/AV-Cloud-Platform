# Local stack for testing before AWS: PostgreSQL + MongoDB (DocumentDB stand-in) + MinIO (S3 stand-in) + API + worker
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    volumes: [ "./local/initdb:/docker-entrypoint-initdb.d:ro" ]
    ports: [ "5432:5432" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 20 }
  mongo:
    image: mongo:7
    ports: [ "27017:27017" ]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: [ "9000:9000", "9001:9001" ]
  api: &app
    build: ./backend
    depends_on: { postgres: { condition: service_healthy }, mongo: { condition: service_started }, minio: { condition: service_started } }
    environment: &env
      APP_ENV: local
      AUTH_MODE: local
      DB_HOST: postgres
      MONGO_URL: mongodb://mongo:27017
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      SIM_API_KEY: sim-local-key
    ports: [ "8000:8000" ]
  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    ports: []
